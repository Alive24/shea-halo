[project]
name = "shea-halo"
version = "0.1.0"
description = "Issue-driven agent improvement investigations with framework-native tracing"
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["agents", "github", "halo", "observability", "tracing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "halo-engine==0.3.5",
  "inference-catalyst-tracing[openai-agents]==0.1.10",
  "openai-agents==0.14.7",
  "opentelemetry-exporter-otlp-proto-common==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "pydantic==2.13.3",
  "protobuf==7.35.1",
  "requests==2.34.2",
]

[project.urls]
Repository = "https://github.com/Alive24/shea-halo"
Issues = "https://github.com/Alive24/shea-halo/issues"

[dependency-groups]
dev = [
  "basedpyright==1.38.3",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.12",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shea_halo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests"]
